<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Fonts: Inter, Outfit & Noto Naskh Arabic (Urdu) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B35" />
    <meta name="background-color" content="#0B0F19" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FoodDash Enterprise" />

    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FoodDash Enterprise" />

    <!-- Enterprise SEO -->
    <title>FoodDash Pakistan — Pearl Continental, Kolachi, Monal & Top Pakistani Brands Delivery</title>
    <meta name="description" content="FoodDash Enterprise Pakistan — Order from Pearl Continental Hotel, Kolachi, Monal, Cheezious, Student Biryani & Savour Foods with 15-min delivery and live GPS tracking across Lahore, Karachi & Islamabad." />
    <meta name="keywords" content="FoodDash Pakistan, PC Hotel, Kolachi, Monal, Cheezious, Student Biryani, Savour Foods, Butt Karahi, Pakistani food delivery, PKR food app" />
    <meta name="author" content="Muhammad Ayan" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:title" content="FoodDash Pakistan — Pearl Continental, Kolachi & Monal Delivery" />
    <meta property="og:description" content="Order from top Pakistani hotels & food brands with live GPS tracking in PKR, JazzCash & EasyPaisa." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fooddash.pk" />
    <meta property="og:image" content="/images/app_preview.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodDash Pakistan — Top Brands Delivery" />
    <meta name="twitter:description" content="Pakistani gourmet food delivered in 15 mins with live GPS tracking." />
    <meta name="twitter:image" content="/images/app_preview.png" />

    <!-- JSON-LD Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "name": "FoodDash Pakistan",
      "image": "https://fooddash.pk/images/app_preview.png",
      "description": "Next-generation Pakistani food delivery platform featuring Pearl Continental, Kolachi, Monal & top national brands.",
      "url": "https://fooddash.pk",
      "telephone": "0800-FOOD-DASH",
      "priceRange": "₨₨",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "150000"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Okra:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Cache buster for stale PWA service workers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
        caches.keys().then(function(cacheNames) {
          cacheNames.forEach(function(cacheName) {
            caches.delete(cacheName);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
