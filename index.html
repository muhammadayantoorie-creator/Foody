<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Viewport & Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B35" />
    <meta name="background-color" content="#0B0F19" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FoodDash Enterprise" />

    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FoodDash Enterprise" />

    <!-- Enterprise SEO -->
    <title>FoodDash — Food Delivered Smarter, Faster & Fresher</title>
    <meta name="description" content="FoodDash Enterprise — Next-gen 3D food delivery and logistics platform. Order gourmet food from 500+ top-rated artisanal kitchens with 15-min delivery and real-time 3D GPS radar tracking." />
    <meta name="keywords" content="FoodDash, food delivery, gourmet burgers, pizza delivery, sushi, 3D tracking, fast food logistics, food app" />
    <meta name="author" content="Muhammad Ayan" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:title" content="FoodDash Enterprise — Food Delivered Smarter, Faster & Fresher" />
    <meta property="og:description" content="Order gourmet dishes with live 3D GPS radar tracking and 15-minute express delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fooddash.app" />
    <meta property="og:image" content="/images/app_preview.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FoodDash Enterprise — 3D Food Logistics" />
    <meta name="twitter:description" content="Gourmet food delivered in 15 mins with real-time GPS tracking." />
    <meta name="twitter:image" content="/images/app_preview.png" />

    <!-- JSON-LD Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "name": "FoodDash Enterprise",
      "image": "https://fooddash.app/images/app_preview.png",
      "description": "Next-generation 3D food delivery and logistics platform.",
      "url": "https://fooddash.app",
      "telephone": "+1-800-FOOD-DASH",
      "priceRange": "$$",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "120000"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Okra:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Cache buster for stale PWA service workers -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
        caches.keys().then(function(cacheNames) {
          cacheNames.forEach(function(cacheName) {
            caches.delete(cacheName);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
